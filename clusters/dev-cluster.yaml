kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fintech-dev
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  disableDefaultCNI: false
  kubeProxyMode: "iptables"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=master,environment=dev"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 3000
        hostPort: 3000
        protocol: TCP
      - containerPort: 9090
        hostPort: 9090
        protocol: TCP
    extraMounts:
      - hostPath: /dev/mount
        containerPath: /dev/mount
        readOnly: true
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=worker,environment=dev,workload-type=general"
    labels:
      node-role: worker
      environment: dev
      workload-type: general
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=worker,environment=dev,workload-type=memory-intensive"
    labels:
      node-role: worker
      environment: dev
      workload-type: memory-intensive